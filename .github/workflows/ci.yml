name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: gradle/actions/wrapper-validation@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests and lint
        run: ./gradlew testFullDebugUnitTest lintFullDebug lintLiteDebug

      - name: Debug APKs (full and lite)
        run: ./gradlew assembleFullDebug assembleLiteDebug

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: app/build/reports/
          retention-days: 14

      - uses: actions/upload-artifact@v4
        with:
          name: daypurse-debug-apk
          path: app/build/outputs/apk/*/debug/*.apk
          retention-days: 14
